<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Reseñas - Monitoreo de Calidad de Agua</title>
    <link rel="stylesheet" href="panel.css">
</head>

<body>
    <div class="background-shapes">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>
        <div class="shape shape4"></div>
    </div>

    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="admin-container">
        <div class="header">
            <div class="header-content">
                <h1>Panel de Reseñas</h1>
                <p>Gestiona las reseñas y monitorea la retroalimentación</p>
            </div>
        </div>

        <div class="stats-section">
            <div class="stats-title">📊 Estadísticas Generales</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📝</div>
                    <div class="stat-number" id="totalReviews">24</div>
                    <div class="stat-label">Total Reseñas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⭐</div>
                    <div class="stat-number" id="averageRating">4.2</div>
                    <div class="stat-label">Calificación Promedio</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-number" id="totalUsers">18</div>
                    <div class="stat-label">Usuarios Únicos</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📈</div>
                    <div class="stat-number" id="monthlyGrowth">+12%</div>
                    <div class="stat-label">Crecimiento Mensual</div>
                </div>
            </div>
        </div>

        <div class="filters-section">
            <div class="filters-title">🔍 Filtros y Búsqueda</div>
            <div class="filters-container">
                <div class="filter-group">
                    <label for="searchInput">Buscar por nombre o email:</label>
                    <input type="text" id="searchInput" placeholder="Escribir para buscar...">
                    <span class="icon">🔍</span>
                </div>
                <div class="filter-group">
                    <label for="ratingFilter">Filtrar por calificación:</label>
                    <select id="ratingFilter">
                        <option value="all">Todas las calificaciones</option>
                        <option value="5">⭐⭐⭐⭐⭐ (5 estrellas)</option>
                        <option value="4">⭐⭐⭐⭐ (4 estrellas)</option>
                        <option value="3">⭐⭐⭐ (3 estrellas)</option>
                        <option value="2">⭐⭐ (2 estrellas)</option>
                        <option value="1">⭐ (1 estrella)</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="dateFilter">Filtrar por fecha:</label>
                    <select id="dateFilter">
                        <option value="all">Todas las fechas</option>
                        <option value="today">Hoy</option>
                        <option value="week">Esta semana</option>
                        <option value="month">Este mes</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="reviews-section">
            <div class="reviews-title">💬 Reseñas de Usuarios</div>
            <div class="reviews-list" id="reviewsList">
                <!-- Las reseñas se cargarán aquí dinámicamente -->
            </div>
        </div>

        <div class="action-buttons">
            <button class="action-btn save-changes-btn" id="saveChangesBtn">
                💾 Guardar Cambios
            </button>
            <button class="action-btn back-btn" id="backBtn">🏠 Regresar al Inicio</button>
            <button class="action-btn logout-btn" id="logoutBtn">🚪 Cerrar Sesión</button>
        </div>

        <div class="footer">
            <p>Panel de Administración - Monitoreo de Calidad de Agua</p>
        </div>
    </div>

    <!-- Mensajes de notificación -->
    <div class="success-message" id="successMsg"></div>
    <div class="error-message" id="errorMsg"></div>
    
    <script src="panel.js"></script>
</body>
</html>
