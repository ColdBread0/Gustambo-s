<script>
    function enviarResena() {
      const username = document.getElementById("username").value.trim() || "Anónimo";
      const content = document.getElementById("content").value.trim();
      const messageDiv = document.getElementById("message");

      messageDiv.textContent = "";

      if (!content) {
        messageDiv.textContent = "El contenido de la reseña es obligatorio.";
        return;
      }

      fetch("http://localhost/reviews/backend/crear_resena.php", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name: username,
          content
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          messageDiv.textContent = data.error;
        } else {
          document.getElementById("content").value = "";
          document.getElementById("username").value = "";
          alert("¡Reseña enviada con éxito!");
          //cargarResenas();
        }
      })
      .catch(error => {
        console.error("Error al enviar reseña:", error);
        messageDiv.textContent = "Error al conectar con el servidor.";
      });
    }

    <script>
        let reviewsData = [];

        document.addEventListener('DOMContentLoaded', function() {
            fetchReviews();
        });

        function fetchReviews() {
            fetch('http://localhost/proyectopia/gustambos/backend/get_reviews.php')
                .then(response => response.json())
                .then(data => {
                    reviewsData = data;
                    renderReviews(reviewsData);
                    updateStats();
                })
                .catch(err => {
                    document.getElementById('reviewsList').innerHTML = '<p>Error al cargar reseñas.</p>';
                });
        }

        function renderReviews(reviews) {
            const reviewsList = document.getElementById('reviewsList');
            reviewsList.innerHTML = '';
            if (!Array.isArray(reviews) || reviews.length === 0) {
                reviewsList.innerHTML = '<p>No hay reseñas disponibles.</p>';
                return;
            }
            reviews.forEach(review => {
                const reviewCard = document.createElement('div');
                reviewCard.className = 'review-card';
                reviewCard.innerHTML = `
                    <div class="review-header">
                        <div class="user-info">
                            <div class="user-avatar">👤</div>
                            <div class="user-details">
                                <h3>${review.name || 'Anónimo'}</h3>
                            </div>
                        </div>
                        <div class="review-meta">
                            <div class="rating-display">
                                ${(review.rating && review.rating > 0) ? '⭐'.repeat(review.rating) : ''}
                            </div>
                            <div class="review-date">📅 ${formatDate(review.created_at)}</div>
                        </div>
                    </div>
                    <div class="review-content">
                        <p>${review.content}</p>
                    </div>
                    <div class="review-actions">
                        <button class="action-btn-small hide-btn" onclick="hideReview(${review.id})">👀 Ocultar</button>
                        <button class="action-btn-small delete-btn" onclick="deleteReview(${review.id})">🗑️ Eliminar</button>
                    </div>
                `;
                reviewsList.appendChild(reviewCard);
            });
        }


        function filterReviews() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const ratingFilter = document.getElementById('ratingFilter').value;
            const dateFilter = document.getElementById('dateFilter').value;

            let filteredReviews = reviewsData.filter(review => {
                const matchesSearch = review.firstName.toLowerCase().includes(searchTerm) ||
                    review.lastName.toLowerCase().includes(searchTerm) ||
                    review.email.toLowerCase().includes(searchTerm);

                const matchesRating = ratingFilter === 'all' || review.rating.toString() === ratingFilter;

                const matchesDate = dateFilter === 'all' || checkDateFilter(review.date, dateFilter);

                return matchesSearch && matchesRating && matchesDate;
            });

            renderReviews(filteredReviews);
        }

        function checkDateFilter(reviewDate, filter) {
            const today = new Date();
            const reviewDateObj = new Date(reviewDate);

            switch (filter) {
                case 'today':
                    return reviewDateObj.toDateString() === today.toDateString();
                case 'week':
                    const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
                    return reviewDateObj >= weekAgo;
                case 'month':
                    const monthAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
                    return reviewDateObj >= monthAgo;
                default:
                    return true;
            }
        }

        // Función para formatear fecha
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('es-ES', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        // Función para actualizar estadísticas
        function updateStats() {
            const totalReviews = reviewsData.length;
            const averageRating = (reviewsData.reduce((sum, review) => sum + review.rating, 0) / totalReviews).toFixed(1);
            const uniqueUsers = new Set(reviewsData.map(review => review.email)).size;

            document.getElementById('totalReviews').textContent = totalReviews;
            document.getElementById('averageRating').textContent = averageRating;
            document.getElementById('totalUsers').textContent = uniqueUsers;
        }

            alert(`Editando reseña #${reviewId}`);
        }



        function exportReviews() {
            alert('Exportando reseñas...');
        }

        function goBack() {
            window.location.href = '../Alan/index.html';
        }
    </script>
